# Research configuration (§12, §24, §29).

novelty_classes:
  A:
    label: "clearly existing"
    novelty_score: 2.0
  B:
    label: "very similar existing mechanism"
    novelty_score: 4.0
  C:
    label: "adjacent mechanism"
    novelty_score: 6.0
  D:
    label: "appears substantially novel"
    novelty_score: 8.5
  E:
    label: "insufficient evidence"
    novelty_score: 5.0

novelty_language:
  # §12: never claim "nobody has ever done this".
  forbidden_claim: "Nobody has ever done this."
  required_claim: >-
    No substantially similar implementation was identified in the searched sources.

source_preferences:
  - academic papers
  - official protocol documentation
  - official repositories
  - government datasets
  - international organizations
  - established research institutions

evidence_levels:
  - FACT        # directly verified from an authoritative source
  - INFERENCE   # reasoned from facts
  - HYPOTHESIS  # proposed, not yet tested

# Source domains the Discovery Agent must span (§24).
discovery_domains:
  - monetary economics
  - stablecoins
  - payments
  - demographics
  - AI productivity
  - energy
  - climate
  - commodities
  - insurance
  - prediction markets
  - labor
  - global trade
  - internet
  - biology
  - ecology
  - game theory
  - information theory
  - network economics
  - financial markets
  - distributed systems

# Discovery-generation settings (Phase 1).
discovery:
  ideas_per_batch: 5          # ideas requested per LLM call
  max_description_chars: 2000
  # §18: do not generate combinations randomly only — prompt for economic
  # compatibility and semantic bridge reasoning.
  require_combinatorics: true

# De-duplication settings (Phase 1). Deterministic, pure-Python.
dedup:
  # Token-overlap similarity (Jaccard on normalized keyword tokens).
  exact_threshold: 0.95       # at/above: duplicate
  near_threshold: 0.60        # at/above: near-duplicate (flagged, human-reviewable)
  # Shingled name similarity catches "Population Money" vs "Population Currency".
  name_shingle_size: 2
