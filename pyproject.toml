[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blockchain-rd-lab"
version = "0.1.0"
description = "Autonomous AI-powered research laboratory for discovering, evaluating, simulating, attacking, and ranking novel blockchain economic mechanisms."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AI Blockchain R&D Lab" }]
keywords = ["blockchain", "research", "economics", "mechanism-design", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
analytics = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "networkx>=3.3",
    "statsmodels>=0.14",
    "optuna>=3.6",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
lab = "blockchain_rd_lab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/blockchain_rd_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: full-funnel integration tests (the §42 success run, ~10s)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108", "UP047"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["blockchain_rd_lab"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
